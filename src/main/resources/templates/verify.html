<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NPTEL Certificate NOC-E9RC-8P2V-TJ807</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f4f7fb;
        }
        body.certificate-only {
            margin: 0;
            background: #fff;
            overflow: hidden;
        }
        .certificate-image {
            display: block;
            width: min(1065px, calc(100vw - 6cm));
            max-width: 100%;
            height: auto;
            margin: 0;
            background: #fff;
            border: 1px solid #d9d9d9;
            cursor: pointer;
        }
        .certificate-download {
            display: flex;
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
        .certificate-download:hover {
            cursor: pointer;
        }
        .hero {
            background: linear-gradient(135deg, #123b69, #176b87);
            color: white;
        }
        .verification-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 2rem rgba(18, 59, 105, .12);
        }
        .status-icon {
            width: 3.5rem;
            height: 3.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
        }
        .details dt {
            color: #6c757d;
            font-weight: 500;
        }
        .details dd {
            font-weight: 600;
        }
    </style>
</head>
<body class="certificate-only">
<div>
    <a class="certificate-download"
       th:href="@{/verify/{id}/certificate.pdf(id=${searchedId})}"
       download="certificate.pdf"
       aria-label="Download certificate PDF">
        <img class="certificate-image"
             src="/finalimage.png"
             alt="Certificate">
    </a>
</div>

</body>
</html>
